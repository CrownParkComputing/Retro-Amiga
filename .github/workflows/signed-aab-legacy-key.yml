name: Signed AAB (legacy upload key)

# Runs in CrownParkComputing/uae4arm_2026, which holds the ORIGINAL Play
# upload key as the RELEASE_* secrets. The Retro-Amiga repo's own key is a
# different one Play will not accept; this workflow exists so a bundle can be
# signed with the key Play enrolled, from the current code.

on:
  workflow_dispatch:
  push:
    tags:
      - "playkey-*"

permissions:
  contents: read

jobs:
  signed-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Validate signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release bundle
        working-directory: app
        env:
          # The gradle resolveKeystore() reads ANDROID_KEYSTORE_*; map the old
          # RELEASE_* secret names onto them so the same build.gradle.kts works.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # arm64-v8a only: two ABIs of the 1.1M-line core OOM-killed the
          # runner. arm64 covers effectively every real device; x86_64 is
          # emulators and Chromebooks, which this emulator is not aimed at.
          ORG_GRADLE_PROJECT_androidAbiFilters: arm64-v8a
          # Keep the JVM and the C++ toolchain inside the runner's RAM.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: flutter build appbundle --release

      - name: Print signing fingerprint
        run: |
          keytool -printcert -jarfile app/build/app/outputs/bundle/release/app-release.aab \
            | grep -E "SHA1:|SHA256:" || true

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: retro-amiga-release-aab-playkey
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 5
