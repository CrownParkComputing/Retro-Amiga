name: Extract signing key

# One-shot: emits the enrolled Play upload key (RELEASE_* secrets) as a
# private, short-retention artifact so it can be moved to the public repo's
# CI. Seconds long, so it finishes before this private repo's metered Actions
# minutes trip. Delete this workflow after use.

on:
  workflow_dispatch:
  push:
    tags:
      - "extractkey-*"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Emit keystore and credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p out
          printf '%s' "$RELEASE_KEYSTORE_BASE64" > out/keystore.b64
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > out/release.jks
          {
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > out/creds.properties
          echo "jks bytes: $(wc -c < out/release.jks)"
          keytool -list -v -keystore out/release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" 2>/dev/null | grep -E "SHA1:|Alias" | head -3 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          if-no-files-found: error
          retention-days: 1
