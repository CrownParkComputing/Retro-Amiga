name: Build signed Android App Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build signed release bundle
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # arm64-v8a alone: every phone and tablet this is aimed at.
          #
          # x86_64 went because it is Chromebooks and emulators, and this is
          # a touch-controlled Amiga.
          #
          # armeabi-v7a went because nothing here can test it, not because the
          # core cannot build for it. amiberry_mem.cpp has a 32-bit path:
          # CPU_64_BIT forces natmem to 4GB, and the #else caps it at 3GB with
          # UAE_VM_32BIT kept. But 3GB is not reservable in a 32-bit Android
          # process either, so it lands in the shrink-and-retry fallback and
          # runs with far less Z3 fastmem, on a different JIT backend. That is
          # an execution path no device on this project can run: they are all
          # arm64, and recent arm64 SoCs cannot execute 32-bit code at all.
          #
          # Both show up on the release as lost device support - 5,812 devices
          # for the 32-bit one - and need acknowledging; that is deliberate.
          # Neither removal changes what an arm64 user downloads, since Play
          # serves one ABI split per device, but each dropped build cuts CI.
          ORG_GRADLE_PROJECT_androidAbiFilters: arm64-v8a
        run: flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: retro-amiga-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 5

      # The bundle goes to Play; the APK is what a person can actually
      # sideload, so a tag's release carries both.
      - name: Build signed APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_androidAbiFilters: arm64-v8a
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-amiga-release-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 5

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-aab
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/retro-amiga-release-apk/*.apk
            artifacts/retro-amiga-release-aab/*.aab
